name: Tauri CI

on:
  push:
    branches: [ main, rewrite/tauri ]
  pull_request:
    branches: [ main, rewrite/tauri ]

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            src-tauri -> target
            admin/src-tauri -> target

      - name: Test kermo_core
        run: cargo test -p kermo_core --manifest-path src-tauri/Cargo.toml

      - name: Check Admin Tool
        run: cargo check --manifest-path admin/src-tauri/Cargo.toml

      - name: Check frontend
        run: |
          npm ci
          npm run check
