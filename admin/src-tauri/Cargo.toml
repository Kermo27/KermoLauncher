[package]
name = "kermo-admin"
version = "2.0.0"
description = "KermoLauncher Admin"
authors = ["Kermo"]
edition = "2021"
license = "Unlicense"

[lib]
name = "kermo_admin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kermo_core = { path = "../../src-tauri/crates/kermo_core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[workspace]
