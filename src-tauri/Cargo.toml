[package]
name = "kermo-launcher"
version = "2.0.1"
description = "KermoLauncher"
authors = ["Kermo"]
edition = "2021"
license = "Unlicense"

[lib]
name = "kermo_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[workspace]
members = ["crates/kermo_core"]
resolver = "2"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
kermo_core = { path = "crates/kermo_core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-process = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-log = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
